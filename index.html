<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE GALAXY OFFICIAL</title>
    <style>
        :root { --gold: #ffd700; --bg: #050505; --glass: rgba(255,255,255,0.05); }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-image: radial-gradient(circle, #1a1a2e, #000); }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; z-index: -1; }
        .card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,215,0,0.2); border-radius: 35px; padding: 30px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; }
        #login-page { position: absolute; top:0; left:0; width:100%; height:100%; background:#0a0a1a; z-index:100; border-radius:35px; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:25px; box-sizing:border-box; }
        .vault-value { font-size: 3rem; color: var(--gold); text-shadow: 0 0 20px var(--gold); margin: 10px 0; font-weight: bold; }
        .avatar-aura { width: 120px; height: 120px; margin: 15px auto; border-radius: 50%; padding: 4px; background: linear-gradient(45deg, var(--gold), transparent, var(--gold)); animation: rotate 4s linear infinite; cursor: pointer; }
        .avatar-inner { background: #0a0a1a; width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; background: #111; color: white; text-align: center; font-size: 1rem; }
        .btn { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(255,215,0,0.2); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 15px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="card">
        <div id="login-page">
            <h2 style="color: var(--gold);">VIBE GALAXY</h2>
            <p style="font-size: 0.8rem; color: #888;">أدخل الرمز الملكي للدخول</p>
            <input type="password" id="pass" placeholder="رمز السر (1234)">
            <button class="btn" onclick="login()">دخول النظام</button>
        </div>
        <div style="font-size: 0.7rem; color: var(--gold); letter-spacing: 2px;">الرصيد الملكي</div>
        <div class="vault-value" id="balance">0</div>
        <div class="avatar-aura" onclick="tap()">
            <div class="avatar-inner">KI</div>
        </div>
        <h2 style="margin: 5px 0;">القيصر VIBE</h2>
        <div class="stats">
            <div class="stat-box"><span id="power" style="color: var(--gold);">1</span><br><small>قوة الضربة</small></div>
            <div class="stat-box"><span id="auto" style="color: var(--gold);">0</span><br><small>تعدين/ث</small></div>
        </div>
        <button class="btn" style="background: white; margin-top: 15px;" onclick="buyAuto()">شراء تعدين آلي (50 نقطة)</button>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('v_score')) || 0;
        let autoRate = parseInt(localStorage.getItem('v_auto')) || 0;

        function login() {
            if(document.getElementById('pass').value === "1234") {
                document.getElementById('login-page').style.display = 'none';
            } else { alert("الرمز غير صحيح!"); }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(score).toLocaleString();
            document.getElementById('auto').innerText = "+" + autoRate;
            localStorage.setItem('v_score', score);
            localStorage.setItem('v_auto', autoRate);
        }

        function tap() {
            score += 1;
            updateUI();
        }

        function buyAuto() {
            if(score >= 50) {
                score -= 50;
                autoRate += 1;
                updateUI();
            } else { alert("نقاطك لا تكفي!"); }
        }

        setInterval(() => {
            if(autoRate > 0) {
                score += (autoRate / 10);
                updateUI();
            }
        }, 100);

        updateUI();
    </script>
</body>
</html>
