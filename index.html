<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE GALAXY - ROYAL SYSTEM</title>
    <style>
        :root {
            --gold: #ffd700;
            --deep-space: #050505;
            --neon-blue: #00f3ff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            background: var(--deep-space);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            z-index: -1;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 35px;
            padding: 40px 25px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            display: none; /* إخفاء كل شيء في البداية */
        }

        /* شاشة تسجيل الدخول */
        #login-screen { display: block; }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 50px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(0,0,0,0.5);
            color: white;
            text-align: center;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-main {
            background: var(--gold);
            color: black;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transition: 0.3s;
        }

        /* واجهة لوحة التحكم */
        .vault-value { font-size: 3rem; color: var(--gold); text-shadow: 0 0 20px var(--gold); margin: 10px 0; }
        
        .avatar-aura {
            width: 120px; height: 120px; margin: 20px auto; border-radius: 50%; padding: 3px;
            background: linear-gradient(45deg, var(--gold), transparent, var(--gold));
            animation: rotate 3s linear infinite;
        }
        .avatar-inner {
            background: #0a0a1a; width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div id="login-screen" class="card">
        <h2 style="color: var(--gold);">نظام الدخول الملكي</h2>
        <p style="font-size: 0.8rem; color: #888;">أدخل رمز القيصر للوصول للمجرة</p>
        <input type="text" id="user-input" placeholder="اسم القيصر">
        <input type="password" id="pass-input" placeholder="رمز السر">
        <button class="btn-main" onclick="validateLogin()">تفعيل النظام</button>
        <p id="error-text" style="color: #ff0055; font-size: 0.8rem; margin-top: 10px; display: none;">الرمز غير صحيح!</p>
    </div>

    <div id="dashboard" class="card">
        <div style="font-size: 0.7rem; letter-spacing: 3px; color: var(--gold);">CENTRAL VAULT</div>
        <div class="vault-value">1,240,500</div>
        
        <div class="avatar-aura">
            <div class="avatar-inner">KI</div>
        </div>
        
        <h2 style="margin: 5px 0;">VIBE GALAXY</h2>
        <span style="background: var(--gold); color: black; padding: 4px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem;">القيصر الملكي</span>

        <div class="stat-grid">
            <div class="stat-box"><span style="color: var(--gold); display: block;">412</span> محارب</div>
            <div class="stat-box"><span style="color: var(--gold); display: block;">88%</span> طاقة</div>
        </div>

        <button class="btn-main" style="background: white;" onclick="location.reload()">خروج</button>
    </div>

    <script>
        function validateLogin() {
            const pass = document.getElementById('pass-input').value;
            if (pass === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('error-text').style.display = 'block';
            }
        }
    </script>
</body>
</html>
