<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE GALAXY PRO</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; text-align: center; background-image: radial-gradient(circle, #1a1a2e, #050505); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; padding: 30px; width: 80%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; font-size: 2.5rem; margin: 10px 0; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ffd700; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: #111; box-shadow: 0 0 20px #ffd700; }
        .rank { background: #ffd700; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .btn { background: white; color: black; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 0.8rem; letter-spacing: 2px;">خزنة المجرة</div>
        <div class="gold">1,240,500</div>
        <div class="avatar">KI</div>
        <div class="rank">القيصر الملكي</div>
        <h2 style="margin: 10px 0;">الملف الشخصي</h2>
        <button class="btn">دخول النظام</button>
    </div>
</body>
</html>
